default_criteria:
  min_n: 30
  top_k: 20
  max_atomic_claims: 30
  atomic_q_threshold: 0.10
  atomic_p_threshold: null
  atomic_min_abs_t: 2.0
  atomic_min_abs_coef: null
  composite_min_support_rois: 3
  composite_min_mean_abs_t: 2.0
  group_min_rois: 3
  group_min_support_rois: 2
  group_min_fraction_support: 0.20
  group_min_mean_abs_t: 1.5
  ranking_top_k: 20
  ranking_min_valid_rois: 5
  direction_min_fraction_same_sign: 0.70
  direction_min_support_rois: 5
  latent_min_explained_variance: 0.05
  latent_top_k: 20
  latent_min_metadata_abs_corr: 0.20
