  - {setting_id: 'ADNI_BASELINE_{FEATURE}_MMSE', dataset: ADNI_baseline, feature_spaces: [fs8_cortical_volume, fs8_subcortical_volume], claim_type: mmse_association, target: mmse, covariates: [age, sex, education, icv], standardize_target: true}
